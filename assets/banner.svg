<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abdelrahman Beaih — Full-Stack MERN Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0f2b1d"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ccb7a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5ccb7a"/>
      <stop offset="1" stop-color="#5ccb7a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#5ccb7a" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <circle cx="1030" cy="60" r="120" fill="#22c55e" fill-opacity="0.14" filter="url(#glow)"/>
  <circle cx="150" cy="220" r="100" fill="#5ccb7a" fill-opacity="0.10" filter="url(#glow)"/>

  <g fill="#5ccb7a">
    <circle cx="220" cy="240" r="3" opacity="0"><animate attributeName="cy" values="270;30" dur="9s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="240" r="2.5" opacity="0"><animate attributeName="cy" values="270;20" dur="11s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="240" r="3.5" opacity="0"><animate attributeName="cy" values="270;40" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.75;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="240" r="2" opacity="0"><animate attributeName="cy" values="270;25" dur="12s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.55;0" dur="12s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="240" r="3" opacity="0"><animate attributeName="cy" values="270;50" dur="9.5s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.65;0" dur="9.5s" begin="5s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="240" r="2.5" opacity="0"><animate attributeName="cy" values="270;35" dur="10.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="10.5s" begin="3s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="105" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="1">Abdelrahman Beaih</text>
    <text x="600" y="152" font-size="24" font-weight="600" fill="#5ccb7a" letter-spacing="3">FULL-STACK MERN DEVELOPER</text>
    <text x="600" y="190" font-size="19" fill="#9ca3af" direction="rtl">مطوّر ويب — ببني تجارب ثنائية اللغة بالعربية والإنجليزية</text>
  </g>

  <rect x="350" y="212" width="500" height="2.5" rx="1.25" fill="url(#accent)"/>
</svg>
